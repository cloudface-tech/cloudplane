<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- CloudPlane horizontal logo — all white (for colored/photo backgrounds) -->

  <!-- Icon: cloud and plane, all white -->
  <g transform="translate(0, 0) scale(0.75)">
    <!-- Cloud shape — white -->
    <path
      d="M50 40a8 8 0 0 0-1.17-16.94A11 11 0 0 0 28.5 19a10 10 0 0 0-13.37 9.43A8.5 8.5 0 0 0 16 45h26a8 8 0 0 0 8-5z"
      fill="white"
    />
    <!-- Plane elements at reduced opacity to show on white cloud -->
    <!-- Fuselage -->
    <path d="M38 22 L42 26 L30 38 L26 34 Z" fill="white" opacity="0.45"/>
    <!-- Right wing -->
    <path d="M40 24 L47 18 L41 28 Z" fill="white" opacity="0.45"/>
    <!-- Left wing -->
    <path d="M29 36 L22 42 L28 32 Z" fill="white" opacity="0.45"/>
    <!-- Tail fin -->
    <path d="M27 35 L22 38 L28 38 Z" fill="white" opacity="0.45"/>
  </g>

  <!-- "CloudPlane" text — white -->
  <text
    x="52"
    y="31"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="18"
    font-weight="600"
    letter-spacing="-0.3"
    fill="#ffffff"
  >CloudPlane</text>
</svg>

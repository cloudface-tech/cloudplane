services:
  web:
    image: ghcr.io/cloudface-tech/cloudplane-web:latest
    container_name: cloudplane-web
    restart: always
    depends_on:
      - api

  admin:
    image: ghcr.io/cloudface-tech/cloudplane-admin:latest
    container_name: cloudplane-admin
    restart: always
    depends_on:
      - api

  space:
    image: ghcr.io/cloudface-tech/cloudplane-space:latest
    container_name: cloudplane-space
    restart: always
    depends_on:
      - api

  api:
    image: ghcr.io/cloudface-tech/cloudplane-api:latest
    container_name: cloudplane-api
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - .env.prod
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq

  worker:
    image: ghcr.io/cloudface-tech/cloudplane-api:latest
    container_name: cloudplane-worker
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - .env.prod
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  beat-worker:
    image: ghcr.io/cloudface-tech/cloudplane-api:latest
    container_name: cloudplane-beat
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - .env.prod
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  live:
    image: ghcr.io/cloudface-tech/cloudplane-live:latest
    container_name: cloudplane-live
    restart: always

  proxy:
    image: ghcr.io/cloudface-tech/cloudplane-proxy:latest
    container_name: cloudplane-proxy
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cloudplane.rule=Host(`cloudplane.cloudface.tech`)"
      - "traefik.http.routers.cloudplane.entrypoints=websecure"
      - "traefik.http.routers.cloudplane.tls.certresolver=letsencrypt"
      - "traefik.http.services.cloudplane.loadbalancer.server.port=80"
    networks:
      - default
      - cloudface_proxy
    depends_on:
      - web
      - admin
      - space
      - api
      - live

  plane-db:
    image: postgres:15.7-alpine
    container_name: cloudplane-db
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env.prod

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    container_name: cloudplane-redis
    restart: always
    volumes:
      - redisdata:/data

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    container_name: cloudplane-mq
    restart: always
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    env_file:
      - .env.prod

  plane-minio:
    image: minio/minio
    container_name: cloudplane-minio
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    env_file:
      - .env.prod

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:

networks:
  cloudface_proxy:
    external: true
